<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News — Medicine4life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Arimo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<noscript><style>.reveal{opacity:1!important;transform:none!important;}</style></noscript>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <div class="logo"><svg class="logo-mark" width="22" height="22" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="14" cy="14" r="12"/><path d="M14 8v12M8 14h12"/></svg>Medicine4life</div>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="blog.html">Articles</a>
      <a href="news.html" class="active">News</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <h1 style="font-family:var(--font-display); font-size:2rem; margin: 30px 0 8px;">News</h1>
  <p style="color:var(--ink-soft); margin-bottom: 20px;">Short updates on approvals, studies, and launches — quicker reads than the full articles.</p>

  <div id="featured-slot"></div>

  <div class="section-label" id="rest-label" style="display:none;">More news</div>
  <div id="news" class="card-grid"></div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span class="brand-mark"><svg width="16" height="16" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 15h6l3-9 4 18 3-9h6"/></svg>Medicine4life — medical technology, explained clearly</span>
    <span>&copy; 2026</span>
  </div>
</footer>

<script>
const NEWS_ICON = '<svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15h6l3-9 4 18 3-9h6"/></svg>';

fetch('news.json')
  .then(response => response.json())
  .then(items => {
    const featuredSlot = document.getElementById('featured-slot');
    const container = document.getElementById('news');

    if (!items.length) {
      featuredSlot.innerHTML = '<p style="padding: 20px 0; color: var(--ink-soft);">No news items yet.</p>';
      return;
    }

    const [first, ...rest] = items;
    featuredSlot.innerHTML = `
      <a class="featured reveal" href="${first.link}">
        <div class="featured-img">${first.image ? `<img src="${first.image}" alt="" style="width:100%;height:100%;object-fit:cover;">` : NEWS_ICON}</div>
        <div class="featured-body">
          <div class="tag">${NEWS_ICON}News</div>
          <h2>${first.title}</h2>
          <p>${first.summary || ''}</p>
          <div class="meta">${first.dateDisplay || ''}</div>
        </div>
      </a>`;

    if (rest.length) document.getElementById('rest-label').style.display = 'block';

    container.innerHTML = rest.map(item => {
      const thumb = item.image ? `<img src="${item.image}" alt="" style="width:100%;height:100%;object-fit:cover;">` : NEWS_ICON;
      return `
        <a class="grid-card reveal" href="${item.link}">
          <div class="grid-img">${thumb}</div>
          <div class="grid-body">
            <div class="tag">${NEWS_ICON}News</div>
            <h3>${item.title}</h3>
            <span>${item.dateDisplay || ''}</span>
          </div>
        </a>`;
    }).join('');

    window.initReveal();
  })
  .catch(error => {
    document.getElementById('news').innerHTML =
      '<p style="padding: 20px 0; color: var(--ink-soft);">Unable to load news right now.</p>';
    console.error(error);
  });
</script>

<script src="script.js" defer></script>
</body>
</html>
