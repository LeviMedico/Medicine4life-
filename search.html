<style>
  .search-input-wrap { position: relative; margin: 10px 0 30px; }
  .search-input {
    width: 100%;
    box-sizing: border-box;
    padding: 14px 16px 14px 44px;
    font-size: 1.05rem;
    font-family: var(--font-body);
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fff;
    color: var(--ink);
  }
  .search-input:focus { outline: none; border-color: var(--signal); }
  .search-input-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-soft);
    pointer-events: none;
  }
  .search-result {
    display: block;
    padding: 16px 0;
    border-bottom: 1px solid var(--line);
    text-decoration: none;
    color: inherit;
  }
  .search-result:hover .search-result-title { color: var(--signal); }
  .search-result-type {
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--signal);
    margin-bottom: 4px;
  }
  .search-result-title {
    font-family: var(--font-display);
    font-size: 1.1rem;
    margin-bottom: 4px;
    transition: color 0.15s ease;
  }
  .search-result-snippet { color: var(--ink-soft); font-size: 0.92rem; line-height: 1.5; }
  .search-empty, .search-hint { color: var(--ink-soft); padding: 20px 0; }

<script>
let searchIndex = [];

function buildSnippet(text, query) {
  if (!text) return "";
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if (idx === -1) return text.slice(0, 140) + (text.length > 140 ? "…" : "");
  const start = Math.max(0, idx - 60);
  const end = Math.min(text.length, idx + query.length + 60);
  return (start > 0 ? "…" : "") + text.slice(start, end) + (end < text.length ? "…" : "");
}

Promise.all([
  fetch('posts.json').then(r => r.json()).catch(() => []),
  fetch('news.json').then(r => r.json()).catch(() => []),
  fetch('the-basics.json').then(r => r.json()).catch(() => []),
  fetch('student-corner.json').then(r => r.json()).catch(() => []),
  fetch('glossary.json').then(r => r.json()).catch(() => []),
  fetch('diseases.json').then(r => r.json()).catch(() => []),
]).then(([posts, news, basics, corner, glossary, diseases]) => {
  const articleLike = (items, typeLabel) => items.map(item => ({
    type: typeLabel,
    title: item.title,
    text: item.summary || "",
    link: item.link,
  }));

  searchIndex = [
    ...articleLike(posts, "Article"),
    ...articleLike(news, "News"),
    ...articleLike(basics, "The Basics"),
    ...articleLike(corner, "Student Corner"),
    ...glossary.map(g => ({
      type: "Glossary",
      title: g.term,
      text: g.definition,
      link: `glossary.html#${g.slug}`,
    })),
    ...diseases.map(d => ({
      type: "Disease Library",
      title: d.name,
      text: d.overview,
      link: `disease-library.html#${d.slug}`,
    })),
  ];

  // If the page was opened with ?q=..., run that search immediately
  const params = new URLSearchParams(window.location.search);
  const initialQuery = params.get('q');
  if (initialQuery) {
    document.getElementById('searchInput').value = initialQuery;
    runSearch(initialQuery);
  }
}).catch(() => {
  document.getElementById('searchResults').innerHTML =
    '<p class="search-empty">Unable to load search data right now.</p>';
});

function runSearch(query) {
  const container = document.getElementById('searchResults');
  const q = query.trim();

  if (!q) {
    container.innerHTML = '<p class="search-hint">Start typing to search across everything on the site.</p>';
    return;
  }

  const qLower = q.toLowerCase();
  const matches = searchIndex.filter(item =>
    (item.title && item.title.toLowerCase().includes(qLower)) ||
    (item.text && item.text.toLowerCase().includes(qLower))
  ).slice(0, 40);

  if (!matches.length) {
    container.innerHTML = `<p class="search-empty">No results for "${q}".</p>`;
    return;
  }

  container.innerHTML = matches.map(item => `
    <a class="search-result" href="${item.link}">
      <div class="search-result-type">${item.type}</div>
      <div class="search-result-title">${item.title}</div>
      <div class="search-result-snippet">${buildSnippet(item.text, q)}</div>
    </a>
  `).join("");
}

const searchInput = document.getElementById('searchInput');
let debounceTimer;
searchInput.addEventListener('input', (e) => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => runSearch(e.target.value), 120);
});
searchInput.focus();
</script>
