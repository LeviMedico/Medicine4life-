<!DOCTYPE html>
<html>
<head>
  <title>Articles - Medicine4Life</title>
  <meta name="description" content="Latest medical technology, research, and healthcare innovations.">
</head>

<body>

<header class="site-header">
  <div class="wrap">
    <div class="logo">Medicine4Life</div>

    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="blog.html" class="active">Articles</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<main>
  <h1>Medical Articles</h1>
<p>Latest discoveries, technologies, and innovations in medicine.</p>

  <div id="posts"></div>

<script>
fetch('posts.json')
  .then(response => response.json())
  .then(posts => {
    const container = document.getElementById('posts');

    container.innerHTML += `
  <article class="article-card">
    <h2>${post.title}</h2>
    <p class="date">${post.date}</p>
    <p>${post.summary || "Latest discoveries and innovations in medicine."}</p>
    <a href="${post.link}" class="read-more">Read more →</a>
  </article>
`;
    });
  })
  .catch(error => {
    document.getElementById('posts').innerHTML =
      "Unable to load articles.";
    console.error(error);
  });
</script>
</main>

</body>
</html>
