backend:
  name: github
  repo: LeviMedico/Medicine4life-
  branch: main
  base_url: https://medicine4lifecms.sushildethliya300.workers.dev
  auth_endpoint: auth

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "Blog Posts"
    folder: "posts"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Category", name: "tag", widget: "select", options: ["AI Diagnostics", "Wearables", "Diagnostics", "Genomics"], default: "Diagnostics"}
      - {label: "Summary (shown on homepage/article list)", name: "summary", widget: "string", required: false}
      - {label: "Author", name: "author", widget: "string", required: false, default: "Medicine4life", hint: "Shown in the byline under the title."}
      - {label: "Featured Image", name: "image", widget: "image", required: false, hint: "Shows at the top of the article and as the card thumbnail."}
      - {label: "Body", name: "body", widget: "markdown", media_library: {config: {multiple: false}}}

  - name: "news"
    label: "News"
    folder: "news"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Headline", name: "title", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Summary", name: "summary", widget: "text"}
      - {label: "Image (optional)", name: "image", widget: "image", required: false, hint: "Shows at the top of the news item and as a thumbnail in the list."}
      - {label: "Full details (optional, shown when someone opens the item)", name: "body", widget: "markdown", required: false}
      - {label: "Source name (optional)", name: "sourceName", widget: "string", required: false}
      - {label: "Source link (optional)", name: "sourceUrl", widget: "string", required: false}
