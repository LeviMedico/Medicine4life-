<!DOCTYPE html>
<html>
<head>
  <title>Articles - Medicine4Life</title>
  <meta name="description" content="Latest medical technology, research, and healthcare innovations.">
</head>

<body>

<header class="site-header">
  <div class="wrap">
    <div class="logo">Medicine4Life</div>

    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="blog.html" class="active">Articles</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<main>
  <h1>Medical Articles</h1>
  
<p>${post.summary}</p>
<a href="${post.link}">Read more</a>
  <div id="posts"></div>

<script>
fetch('posts.json')
  .then(response => response.json())
  .then(posts => {
    const container = document.getElementById('posts');

    posts.forEach(post => {
      container.innerHTML += `
        <article>
          <h2>${post.title}</h2>
          <p>${post.date}</p>
          <p>${post.summary}</p>
        </article>
      `;
    });
  })
  .catch(error => {
    document.getElementById('posts').innerHTML =
      "Unable to load articles.";
  });
</script>
</main>

</body>
</html>
