<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Articles — Medicine4life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Arimo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<noscript><style>.reveal{opacity:1!important;transform:none!important;}</style></noscript>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <div class="logo"><svg class="logo-mark" width="22" height="22" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="14" cy="14" r="12"/><path d="M14 8v12M8 14h12"/></svg>Medicine4life</div>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="blog.html" class="active">Articles</a>
      <a href="news.html">News</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <h1 style="font-family:var(--font-display); font-size:2rem; margin: 30px 0 8px;">Articles</h1>
  <p style="color:var(--ink-soft); margin-bottom: 20px;">Every post published through the CMS, newest first.</p>

  <div id="featured-slot"></div>

  <div class="filters" id="filters" style="display:none;">
    <div class="chip active" data-filter="all">All</div>
    <div class="chip" data-filter="AI Diagnostics">AI Diagnostics</div>
    <div class="chip" data-filter="Wearables">Wearables</div>
    <div class="chip" data-filter="Diagnostics">Diagnostics</div>
    <div class="chip" data-filter="Genomics">Genomics</div>
  </div>

  <div class="section-label" id="rest-label" style="display:none;">More articles</div>
  <div id="posts" class="card-grid"></div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span class="brand-mark"><svg width="16" height="16" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 15h6l3-9 4 18 3-9h6"/></svg>Medicine4life — medical technology, explained clearly</span>
    <span>&copy; 2026</span>
  </div>
</footer>

<script>
const ICONS = {
  "AI Diagnostics": '<svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M11 8V5M15 8V5M11 20v3M15 20v3M8 11H5M8 15H5M20 11h3M20 15h3"/></svg>',
  "Wearables": '<svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="8" width="10" height="12" rx="3"/><path d="M11 8V4h6v4M11 20v4h6v-4"/><circle cx="14" cy="14" r="2"/></svg>',
  "Diagnostics": '<svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v7l-7 12a2 2 0 0 0 2 3h14a2 2 0 0 0 2-3l-7-12V3"/><path d="M10 3h8"/><path d="M8 18h12"/></svg>',
  "Genomics": '<svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2c9 7 9 7 0 14c9 7 9 7 0 14"/><path d="M20 2c-9 7-9 7 0 14c-9 7-9 7 0 14"/><path d="M8.5 5.5h13M8.5 12.5h13M8.5 15.5h13M8.5 22.5h13"/></svg>'
};
const DEFAULT_ICON = ICONS["Diagnostics"];

fetch('posts.json')
  .then(response => response.json())
  .then(posts => {
    const featuredSlot = document.getElementById('featured-slot');
    const container = document.getElementById('posts');

    if (!posts.length) {
      container.innerHTML = '<p style="padding: 20px 0; color: var(--ink-soft);">No posts yet — write your first one in the CMS.</p>';
      return;
    }

    const [first, ...rest] = posts;
    const firstIcon = ICONS[first.tag] || DEFAULT_ICON;
    featuredSlot.innerHTML = `
      <a class="featured reveal" href="${first.link}" data-tag="${first.tag || ''}">
        <div class="featured-img">${first.image ? `<img src="${first.image}" alt="" style="width:100%;height:100%;object-fit:cover;">` : firstIcon}</div>
        <div class="featured-body">
          <div class="tag">${firstIcon}${first.tag || 'Diagnostics'}</div>
          <h2>${first.title}</h2>
          <p>${first.summary || ''}</p>
          <div class="meta">${first.readMinutes ? first.readMinutes + ' min read' : ''}${first.dateDisplay ? ' · ' + first.dateDisplay : ''}</div>
        </div>
      </a>`;

    if (rest.length) {
      document.getElementById('filters').style.display = 'flex';
      document.getElementById('rest-label').style.display = 'block';
    }

    container.innerHTML = rest.map(post => {
      const icon = ICONS[post.tag] || DEFAULT_ICON;
      const thumb = post.image ? `<img src="${post.image}" alt="" style="width:100%;height:100%;object-fit:cover;">` : icon;
      return `
        <a class="grid-card reveal" href="${post.link}" data-tag="${post.tag || ''}">
          <div class="grid-img">${thumb}</div>
          <div class="grid-body">
            <div class="tag">${icon}${post.tag || 'Diagnostics'}</div>
            <h3>${post.title}</h3>
            <span>${post.readMinutes ? post.readMinutes + ' min read' : ''}</span>
          </div>
        </a>`;
    }).join('');

    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        const filter = chip.dataset.filter;
        document.querySelectorAll('[data-tag]').forEach(card => {
          const show = filter === 'all' || card.dataset.tag === filter;
          card.style.display = show ? '' : 'none';
        });
      });
    });

    window.initReveal();
  })
  .catch(error => {
    document.getElementById('posts').innerHTML =
      '<p style="padding: 20px 0; color: var(--ink-soft);">Unable to load articles right now.</p>';
    console.error(error);
  });
</script>

<script src="script.js" defer></script>
</body>
</html>
